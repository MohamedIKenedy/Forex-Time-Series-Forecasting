name: Forex ML Pipeline CI/CD

on:
  push:
    branches: [ master, develop, Deployment-Branch ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install pytest pytest-cov black flake8 pytest-asyncio

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: black --check .

    - name: Test with pytest
      run: |
        pytest --cov=./ --cov-report=xml
      env:
        PYTHONPATH: .:api

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  train:
    runs-on: ubuntu-latest
    needs: test
    if: false  # Skip model training for now

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install ray[tune] mlflow optuna

    - name: Run model training
      run: |
        python -c "
        # Import and run training script
        exec(open('Notebooks/forex_forecasting_v1.ipynb').read())
        "

    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: models
        path: |
          models/
          scalers/
          feature_importance/
          ensembles/

  infra:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Deployment-Branch'
    outputs:
      public_ip: ${{ steps.tfapply.outputs.public_ip }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0
        terraform_wrapper: false

    - name: Prepare public key
      run: |
        echo "${{ secrets.INFRA_PUBLIC_KEY }}" > ./deploy.pub

    - name: Terraform Init
      working-directory: infrastructure
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      run: |
        terraform init

    - name: Terraform Apply
      id: tfapply
      working-directory: infrastructure
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      run: |
        terraform apply -auto-approve -var "public_key_path=../deploy.pub" -var "my_ip_cidr=${{ secrets.MY_IP_CIDR }}"
        terraform output -raw public_ip > /tmp/ip.txt 2>/dev/null || echo "13.38.119.160" > /tmp/ip.txt
        PUBLIC_IP=$(cat /tmp/ip.txt | xargs)
        echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
        echo "✓ Public IP: ${PUBLIC_IP}"

  deploy:
    runs-on: ubuntu-latest
    needs: [docker, infra]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Deployment-Branch'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ needs.infra.outputs.public_ip }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        passphrase: ${{ secrets.EC2_KEY_PASSPHRASE }}
        script: |
          cd /home/ubuntu/forex-app  # Adjust path as needed
          export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build and push API image
      uses: docker/build-push-action@v4
      with:
        context: ./api
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/forex-api:latest

    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./ui/forex-dash
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/forex-frontend:latest