name: Forex ML Pipeline CI/CD

on:
  push:
    branches: [ master, develop, Deployment-Branch ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install pytest pytest-cov black flake8 pytest-asyncio

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: black --check .

    - name: Test with pytest
      run: |
        pytest --cov=./ --cov-report=xml
      env:
        PYTHONPATH: .:api

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  train:
    runs-on: ubuntu-latest
    needs: test
    if: false  # Skip model training for now

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install ray[tune] mlflow optuna

    - name: Run model training
      run: |
        python -c "
        # Import and run training script
        exec(open('Notebooks/forex_forecasting_v1.ipynb').read())
        "

    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: models
        path: |
          models/
          scalers/
          feature_importance/
          ensembles/

  infra:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Deployment-Branch'
    outputs:
      public_ip: ${{ steps.tfapply.outputs.public_ip }}
      security_group_id: ${{ steps.tfapply.outputs.security_group_id }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0
        terraform_wrapper: false

    - name: Prepare public key
      run: |
        echo "${{ secrets.INFRA_PUBLIC_KEY }}" > ./deploy.pub

    - name: Terraform Init
      working-directory: infrastructure
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      run: |
        terraform init

    - name: Terraform Apply
      id: tfapply
      working-directory: infrastructure
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        TF_LOG: DEBUG
      run: |
        echo "🔍 Starting Terraform Apply..."
        terraform apply -auto-approve -var "public_key_path=../deploy.pub" -var "my_ip_cidr=${{ secrets.MY_IP_CIDR }}"
        
        echo "📊 Capturing Terraform outputs..."
        terraform output -json > /tmp/outputs.json
        cat /tmp/outputs.json
        
        PUBLIC_IP=$(terraform output -raw public_ip)
        SG_ID=$(terraform output -raw security_group_id)
        
        echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
        echo "security_group_id=${SG_ID}" >> $GITHUB_OUTPUT
        echo "✓ Public IP: ${PUBLIC_IP}"
        echo "✓ Security Group: ${SG_ID}"

    - name: Validate Terraform Outputs
      run: |
        if [ -z "${{ steps.tfapply.outputs.public_ip }}" ] || [ -z "${{ steps.tfapply.outputs.security_group_id }}" ]; then
          echo "❌ ERROR: Terraform outputs are missing"
          echo "Public IP: ${{ steps.tfapply.outputs.public_ip }}"
          echo "Security Group ID: ${{ steps.tfapply.outputs.security_group_id }}"
          echo "Please check Terraform Apply step for errors"
          exit 1
        fi
        echo "✓ All Terraform outputs present"

  deploy:
    runs-on: ubuntu-latest
    needs: [docker, infra]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Deployment-Branch'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get GitHub Actions runner IP
      id: runner_ip
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "ip=${RUNNER_IP}" >> $GITHUB_OUTPUT
        echo "📍 Runner IP: ${RUNNER_IP}"

    - name: Temporarily allow SSH from runner IP
      id: add_rule
      run: |
        echo "Security Group ID: ${{ needs.infra.outputs.security_group_id }}"
        echo "Runner IP: ${{ steps.runner_ip.outputs.ip }}"
        RULE_ID=$(aws ec2 authorize-security-group-ingress \
          --group-id ${{ needs.infra.outputs.security_group_id }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.runner_ip.outputs.ip }}/32 \
          --output text \
          --query 'SecurityGroupRules[0].SecurityGroupRuleId' 2>&1 || echo "exists")
        echo "rule_id=${RULE_ID}" >> $GITHUB_OUTPUT
        echo "✓ Temporarily opened SSH for this runner"
        sleep 5

    - name: Wait for EC2 instance initialization
      run: |
        echo "Waiting for EC2 to fully initialize (including SSH)..."
        sleep 90

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ needs.infra.outputs.public_ip }}
        username: ubuntu
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        passphrase: ${{ secrets.EC2_KEY_PASSPHRASE }}
        timeout: 120s
        command_timeout: 15m
        script: |
          cd /home/ubuntu/forex-app
          git config --global --add safe.directory /home/ubuntu/forex-app
          git fetch origin
          git reset --hard origin/Deployment-Branch || git reset --hard origin/main
          export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          which docker-compose || echo "docker-compose not found, installing..."
          if ! command -v docker-compose &> /dev/null; then
            curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose -f docker-compose.prod.yml down || true
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d

    - name: Remove temporary SSH access
      if: always() && steps.add_rule.outputs.rule_id != 'exists'
      run: |
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ needs.infra.outputs.security_group_id }} \
          --security-group-rule-ids ${{ steps.add_rule.outputs.rule_id }} || true
        echo "✓ Removed temporary SSH rule"

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build and push API image
      uses: docker/build-push-action@v4
      with:
        context: ./api
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/forex-api:latest

    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./ui/forex-dash
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/forex-frontend:latest