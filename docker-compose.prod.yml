services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: forex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    container_name: forex-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'

  api:
    image: ${DOCKER_HUB_USERNAME}/forex-api:latest
    container_name: forex-api
    ports:
      - "8000:8000"
    depends_on:
      - kafka
    volumes:
      - ./api/inference_models:/app/inference_models:ro
      - ./api/logs:/app/logs
    environment:
      - WS_UPDATES_MODE=kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${DOCKER_HUB_USERNAME}/forex-frontend:latest
    container_name: forex-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  redis_data: