version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: forex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: forex-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: forex-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
    environment:
      - MLFLOW_TRACKING_URI=file:/app/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000

  api:
    build:
      context: .
      target: production
    container_name: forex-api
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
      - kafka
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./exported_models:/app/exported_models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  training:
    build:
      context: .
      target: training
    container_name: forex-training
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./Notebooks:/app/Notebooks
      - ./mlruns:/app/mlruns
      - ./models:/app/models
      - ./scalers:/app/scalers
    profiles:
      - training  # Only run when explicitly requested

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: forex-monitoring
    depends_on:
      - api
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - API_URL=http://api:8000
    profiles:
      - monitoring
